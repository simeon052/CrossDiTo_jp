name: CrossDiTo CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Run cppcheck
        run: pio check -e x4-pro --fail-on-defect low --fail-on-defect medium --fail-on-defect high

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-x4-pro-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-x4-pro-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Build CrossDiTo for X4 Pro
        run: |
          set -euo pipefail
          pio run -e x4-pro | tee pio-x4-pro.log

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## CrossDiTo X4 Pro firmware build stats"
            grep -E "RAM:\s|Flash:\s" pio-x4-pro.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CrossDiTo-x4-pro
          path: .pio/build/x4-pro/CrossDiTo-*.bin
          if-no-files-found: error

      # 一時的。SDK 更新を実機で確かめる間だけ、シリアルログの出るビルドも
      # 成果物にする（製品ビルドは ENABLE_SERIAL_LOG が無い）。確認できたら消す。
      - name: Build CrossDiTo debug for X4 Pro
        run: pio run -e x4-pro-debug

      - name: Upload debug firmware
        uses: actions/upload-artifact@v7
        with:
          name: CrossDiTo-x4-pro-debug
          path: .pio/build/x4-pro-debug/firmware.bin
          if-no-files-found: error


  # 縦組みは「コンパイルが通った」では何も確認できない。シミュレータを
  # headless で走らせて、実際に描かれた画面を成果物として持ち帰る。
  # 入力スクリプトが固定の時刻で動くため取りこぼしうる（＝落ちても即ちバグとは
  # 限らない）ので、test-status の必須チェックには入れていない。挙動の回帰は
  # scripts/run_simulator_smoke_test.py の側で見る。
  simulator-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install SDL2 and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libssl-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-simulator-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-simulator-
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install Pillow
        run: uv pip install --system pillow

      - name: Generate Japanese test EPUB
        run: python scripts/generate_japanese_test_epub.py

      - name: Screenshots (vertical)
        run: python scripts/run_simulator_screenshots.py --out simulator-shots

      - name: Screenshots (horizontal, for comparison)
        run: python scripts/run_simulator_screenshots.py --no-build --horizontal --out simulator-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simulator-screenshots
          path: |
            simulator-shots/*.png
            simulator-shots/*.bmp
          if-no-files-found: warn

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
